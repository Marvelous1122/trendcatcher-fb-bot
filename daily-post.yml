name: Daily TrendCatcher post

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Debug secret presence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is EMPTY or missing"
          else
            echo "GEMINI_API_KEY is set, length: ${#GEMINI_API_KEY}"
          fi

      - name: Generate and publish today's post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Persist posted-article log
        run: |
          git config user.name "trendcatcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posted_log.json
          git diff --cached --quiet || git commit -m "Update posted-article log [skip ci]"
          git push

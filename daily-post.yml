name: TrendCatcher post (every 3 hours)

on:
  schedule:
    - cron: "15 */3 * * *"  # 8 times/day, offset from the hour
  workflow_dispatch: {}  # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write  # needed to commit posted_log.json back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate and publish this run's post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Persist posted-item log
        run: |
          git config user.name "trendcatcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posted_log.json
          git diff --cached --quiet || git commit -m "Update posted-item log [skip ci]"
          git push
